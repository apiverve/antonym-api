openapi: 3.0.4
info:
  title: Antonym Finder
  description: >-
    Antonym Finder is an antonym lookup API that finds words with opposite
    meanings along with their parts of speech across supported languages. Pass
    any term and an optional language code to receive an array of antonyms.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/antonym:
    get:
      summary: Antonym Finder
      description: >-
        Antonym is a simple tool for getting the antonyms of a word. It returns
        a list of antonyms for the given word.
      operationId: antonym
      parameters:
        - name: word
          in: query
          schema:
            type: string
          required: true
          description: The word to get the antonyms for
          example: happy
        - name: language
          in: query
          schema:
            type: string
          required: false
          description: Language to return the antonyms in. Defaults to English
          example: Spanish
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  partOfSpeech: adjective
                  word: happy
                  language: en
                  antonyms:
                    - sad
                    - unhappy
                    - miserable
                    - depressed
                    - glum
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
